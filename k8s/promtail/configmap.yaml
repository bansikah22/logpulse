apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: logpulse
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: logpulse
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - logpulse
        pipeline_stages:
          - json:
              expressions:
                timestamp: timestamp
                level: level
                message: message
                app: app
                environment: environment
                team: team
                instance: instance
                trace_id: trace_id
                span_id: span_id
                duration_ms: duration_ms
                status_code: status_code
                method: method
                path: path
                user_id: user_id
                error: error
          - labels:
              level:
              app:
              environment:
              team:
          - timestamp:
              source: timestamp
              format: RFC3339Nano
          - output:
              source: message

      - job_name: kubernetes-logs
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - logpulse
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        pipeline_stages:
          - match:
              selector: '{app="noisy-service"}'
              stages:
                - json:
                    expressions:
                      timestamp: timestamp
                      level: level
                      message: message
                      app: app
                      environment: environment
                      team: team
                      instance: instance
                      trace_id: trace_id
                      status_code: status_code
                      method: method
                      path: path
                      error: error
                - labels:
                    level:
                    app:
                    environment:
                    team:
                - timestamp:
                    source: timestamp
                    format: RFC3339Nano