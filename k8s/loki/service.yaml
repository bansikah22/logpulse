apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logpulse
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: log-storage
    app.kubernetes.io/part-of: logpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9096
      targetPort: grpc
      protocol: TCP