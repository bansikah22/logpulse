          "id": 4,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (level) (count_over_time({app=\"noisy-service\"} [$__interval]))",
              "legendFormat": "{{level}}",
              "refId": "A"
            }
          ],
          "title": "Log Volume by Level",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
